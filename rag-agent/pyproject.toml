# SPDX-License-Identifier: MIT

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-agent"
version = "0.4.0"
description = "RAG over hierarchical-header tables: one cell = one sentence, hybrid BM25+dense index, fine-tuned bge encoder, local Qwen reader."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jax0303" }]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "torch>=2.3",
    "transformers>=4.40",
    "bitsandbytes>=0.43",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.7",       # cell-stage vector index (exact IndexFlatIP, per-run)
    "rank-bm25==0.2.2",      # pinned: every call site relies on its BM25Okapi
                             # defaults (k1=1.5, b=0.75, epsilon=0.25)
    "scipy>=1.11",           # significance tests (binomtest / mannwhitneyu)
    "groq>=0.9",             # rag_agent/llm/groq_llm.py (remote reader legs)
    "openpyxl>=3.1",         # analysis/*_xlsx.py failure workbooks
]

[project.optional-dependencies]
# datasets is only needed for the MultiHiertt corpus (HF hub).
benchmarks = ["datasets>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["rag_agent"]
